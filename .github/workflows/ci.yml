name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dreamlog
          POSTGRES_PASSWORD: dreamlog
          POSTGRES_DB: dreamlog
        ports:
          - 5504:5432
        options: >-
          --health-cmd "pg_isready -U dreamlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DREAMLOG_TEST_DATABASE_URL: postgresql://dreamlog:dreamlog@127.0.0.1:5504/dreamlog_test
      DREAMLOG_MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/models
      # The 20 second budget in tests/test_latency.py was measured with base.en
      # on an M5 Pro. A two-core runner gets the smaller model so the same test
      # stays inside the budget there.
      DREAMLOG_WHISPER_MODEL: tiny.en
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-minilm-l6-v2-whisper-tiny-en-v1
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check . && ruff format --check .
        working-directory: api
      - run: mypy
        working-directory: api
      - run: python -m pytest -q
        working-directory: api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
